<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruit & Veggie Sorter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🍎 Drag the items into the correct basket 🥦</h1>

  <div id="item-area"></div>

  <div class="dropzones">
    <div class="dropzone" id="fruit-zone">
      <h2>🍎 Fruits</h2>
    </div>
    <div class="dropzone" id="vegetable-zone">
      <h2>🥦 Vegetables</h2>
    </div>
  </div>

  <script src="items.js"></script>
  <script src="script.js"></script>
  <p id="congrats-message">🎉 Congrats! You sorted everything correctly! 🎉</p>
</body>

</html>
